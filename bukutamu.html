<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Tamu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0757a6;--navy2:#0b8fd8;--gold:#ffc83d;--gold2:#ffdb70;
  --cream:#f3f9ff;--white:#ffffff;--gray1:#edf5fb;--gray2:#d4e5f2;--gray3:#6f8ca6;
  --text:#12324a;--green:#16a765;--green2:#d9f6e8;--red:#e5485d;--red2:#ffe5e9;
  --yellow:#f47c20;--yellow2:#ffead9;
  --shadow:0 16px 40px -12px rgba(7,87,166,.25);--radius:20px;--font:'Poppins','Segoe UI','Arial',sans-serif;
  --shadow-sm:0 6px 20px rgba(7,87,166,.10);
  --blue:#0b8fd8;--blue2:#73cdf2;--font:'Poppins','Segoe UI','Arial',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{font-family:var(--font);background:radial-gradient(circle at 15% 20%,#7dd3fc 0%,var(--navy) 45%,#075985 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 0 2rem;-webkit-font-smoothing:antialiased}

/* Header */
.bt-header{width:100%;background:rgba(0,0,0,.16);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.bt-brand{display:flex;align-items:center;gap:10px;color:var(--white);font-weight:800;font-size:1.1rem;letter-spacing:.2px}
.bt-brand .icon{width:38px;height:38px;background:linear-gradient(135deg,var(--gold),#fde047);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;box-shadow:0 4px 14px rgba(251,191,36,.45)}
.bt-date{color:rgba(255,255,255,.78);font-size:.82rem;text-align:right;line-height:1.4}

/* Card */
.bt-card{background:var(--white);border-radius:26px;box-shadow:0 30px 80px rgba(3,80,120,.4);width:100%;max-width:520px;overflow:hidden;margin:0 1rem}
.bt-card-header{background:linear-gradient(120deg,var(--blue) 0%,var(--blue2) 100%);color:var(--white);padding:1.6rem 1.75rem}
.bt-card-header h1{font-size:1.3rem;font-weight:800;display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem;letter-spacing:-.2px}
.bt-card-header p{font-size:.83rem;color:rgba(255,255,255,.85)}
.bt-card-body{padding:1.85rem}

/* Form */
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:1.1rem}
label{font-size:.8rem;font-weight:700;color:var(--navy);letter-spacing:.2px}
label .req{color:var(--red)}
input,textarea{border:1.5px solid var(--gray2);border-radius:13px;padding:11px 14px;font-family:var(--font);font-size:.92rem;color:var(--text);background:var(--white);transition:border-color .2s var(--ease),box-shadow .2s var(--ease);width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(14,165,233,.18)}
textarea{resize:vertical;min-height:80px}

/* Button */
.btn-submit{width:100%;background:linear-gradient(120deg,var(--blue) 0%,var(--blue2) 100%);color:var(--white);border:none;border-radius:15px;padding:14px;font-size:1rem;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .2s var(--ease);letter-spacing:.3px;margin-top:.5rem;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(14,165,233,.4)}
.btn-submit:disabled{opacity:.7;transform:none;cursor:not-allowed}

/* Spinner */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--white);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Success */
.success-box{display:none;text-align:center}
.success-icon{font-size:3rem;margin-bottom:.75rem}
.success-box h2{font-size:1.2rem;color:var(--navy);margin-bottom:.4rem;font-weight:800}
.success-box p{font-size:.85rem;color:var(--gray3);margin-bottom:1.25rem}
.success-detail{background:var(--cream);border-radius:16px;padding:1.1rem 1.25rem;text-align:left;margin-bottom:1.25rem}
.success-detail .row{display:flex;gap:.75rem;padding:.4rem 0;border-bottom:1px solid var(--gray2);font-size:.85rem}
.success-detail .row:last-child{border-bottom:none}
.success-detail .row label{color:var(--gray3);font-size:.75rem;font-weight:700;text-transform:uppercase;min-width:90px;flex-shrink:0}
.success-detail .row span{color:var(--text);font-weight:600;word-break:break-word}
.btn-again{width:100%;background:var(--green);color:var(--white);border:none;border-radius:15px;padding:12px;font-size:.92rem;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .2s var(--ease)}
.btn-again:hover{background:#0ea472;transform:translateY(-1px)}

/* Tujuan (pimpinan terkunci) */
.target-box{display:flex;align-items:center;gap:10px;background:var(--cream);border:1.5px solid var(--gray2);border-radius:13px;padding:11px 14px;margin-bottom:1.1rem}
.target-box .lbl{font-size:.72rem;font-weight:700;color:var(--gray3);text-transform:uppercase;letter-spacing:.4px}
.target-box .val{font-size:.98rem;font-weight:800;color:var(--navy)}

/* Pilih halaman pimpinan */
.pick-list{display:flex;flex-direction:column;gap:.75rem}
.pick-item{display:flex;align-items:center;gap:12px;padding:16px 18px;border:1.5px solid var(--gray2);border-radius:15px;text-decoration:none;color:var(--navy);font-weight:700;font-size:1rem;transition:all .2s var(--ease);background:var(--white)}
.pick-item:hover{border-color:var(--blue);box-shadow:0 8px 22px rgba(14,165,233,.2);transform:translateY(-1px)}
.pick-item .arrow{margin-left:auto;color:var(--gray3)}

/* Toast */
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--red);color:var(--white);padding:10px 20px;border-radius:13px;font-size:.88rem;font-weight:600;opacity:0;transition:all .35s var(--ease);z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:480px){
  .bt-card{max-width:100%;border-radius:20px}
  .bt-card-body{padding:1.35rem}
}

/* ===== TEMA INFOGRAFIS: BIRU / EMAS / HIJAU / ORANYE ===== */
body{background:linear-gradient(180deg,#034b92 0%,#087fca 22%,#edf8ff 56%,#f8fcff 100%)}
.bt-header{background:linear-gradient(120deg,#034b92 0%,#0757a6 55%,#0b8fd8 100%);box-shadow:0 5px 24px rgba(3,75,146,.28);border-bottom:2px solid rgba(255,200,61,.7)}
.bt-brand .icon{background:linear-gradient(135deg,#ffc83d,#ffdb70);box-shadow:0 5px 16px rgba(255,200,61,.35)}
.bt-card{border:1px solid rgba(7,87,166,.12);box-shadow:0 24px 65px rgba(3,75,146,.22)}
.bt-card-header{background:linear-gradient(120deg,#0757a6 0%,#0b8fd8 100%)}
input,textarea,.toolbar input[type="text"],.toolbar select{border-color:#d4e5f2;background:#fff}
input:focus,textarea:focus,.toolbar input:focus,.toolbar select:focus{border-color:#0b8fd8;box-shadow:0 0 0 3px rgba(11,143,216,.14)}
label{color:#0757a6}
.btn-submit{background:linear-gradient(120deg,#0757a6 0%,#0b8fd8 100%);box-shadow:0 7px 18px rgba(7,87,166,.16)}
.btn-submit:hover{box-shadow:0 10px 28px rgba(7,87,166,.30)}
.btn-again{background:#16a765}.btn-again:hover{background:#118e57}
.target-box,.success-detail{background:#f3f9ff;border-color:#d4e5f2}
.pick-item{color:#0757a6;border-color:#d4e5f2;background:#fff}
.pick-item:hover{border-color:#0b8fd8;box-shadow:0 8px 22px rgba(11,143,216,.14)}
.count-pill{background:rgba(255,200,61,.22);border:1px solid rgba(255,255,255,.25)}
.date-heading{color:#0757a6;border-bottom-color:#edf5fb}
.guest-card{background:#f3f9ff;border-color:#d4e5f2}
.guest-card:hover{border-color:#ffc83d;box-shadow:0 5px 16px rgba(7,87,166,.08)}
.guest-time .jam,.guest-info .nama,.guest-info .meta b{color:#0757a6}
.badge-pimpinan{background:#e2f1ff;color:#0757a6}
.badge-status{background:#d9f6e8;color:#118654}
.btn-refresh:hover{border-color:#0b8fd8;color:#0757a6}
.spinner-lg{border-color:#d4e5f2;border-top-color:#0b8fd8}
.success-box h2{color:#0757a6}

<body>

<div class="bt-header">
  <div class="bt-brand">
    <div class="logo-badge"><div class="logo-img" role="img" aria-label="Logo Pemerintah Kabupaten Hulu Sungai Utara"></div></div>
    <span>Buku Tamu<span id="hdr-pimpinan"></span></span>
  </div>
  <div class="bt-date" id="hdr-date">-</div>
</div>

<div class="bt-card">
  <div class="bt-card-header">
    <h1 id="card-title">📖 Isi Buku Tamu</h1>
    <p id="card-sub">Harap isi data kunjungan Anda dengan lengkap dan benar</p>
  </div>
  <div class="bt-card-body">

    <!-- Pilih halaman (tampil hanya jika alamat tidak menyebut pimpinan) -->
    <div id="pick-area" style="display:none">
      <div class="pick-list" id="pick-list"></div>
    </div>

    <!-- Form -->
    <div id="form-area" style="display:none">
      <div class="target-box">
        <span style="font-size:1.4rem">🏛️</span>
        <div><div class="lbl">Menemui</div><div class="val" id="target-label">-</div></div>
      </div>
      <div class="form-group">
        <label>Nama Lengkap <span class="req">*</span></label>
        <input type="text" id="bt-nama" placeholder="Masukkan nama lengkap" autocomplete="name">
      </div>
      <div class="form-group">
        <label>Alamat / Instansi <span class="req">*</span></label>
        <input type="text" id="bt-instansi" placeholder="Asal instansi atau alamat">
      </div>
      <div class="form-group">
        <label>Keperluan / Tujuan <span class="req">*</span></label>
        <textarea id="bt-keperluan" placeholder="Jelaskan keperluan atau tujuan kunjungan Anda..."></textarea>
      </div>
      <div class="form-group">
        <label>Jumlah Orang <span class="req">*</span></label>
        <input type="number" id="bt-jumlah" min="1" step="1" placeholder="Contoh: 1">
      </div>
      <div class="form-group">
        <label>Tempat <span class="req">*</span></label>
        <input type="text" id="bt-tempat" placeholder="Contoh: Ruang Kerja, Aula, Ruang Rapat...">
      </div>
      <button class="btn-submit" id="btn-simpan" onclick="doSubmit()">
        💾 Simpan
      </button>
    </div>

    <!-- Sukses -->
    <div class="success-box" id="success-area">
      <div class="success-icon">✅</div>
      <h2>Data Berhasil Dicatat!</h2>
      <p>Kunjungan Anda telah tercatat pada agenda hari ini</p>
      <div class="success-detail">
        <div class="row"><label>Menemui</label><span id="r-pimpinan">-</span></div>
        <div class="row"><label>Tanggal</label><span id="r-tanggal">-</span></div>
        <div class="row"><label>Jam</label><span id="r-jam">-</span></div>
        <div class="row"><label>Agenda</label><span id="r-agenda">-</span></div>
        <div class="row"><label>Tempat</label><span id="r-tempat">-</span></div>
        <div class="row"><label>Keperluan</label><span id="r-keperluan">-</span></div>
        <div class="row"><label>Jumlah Orang</label><span id="r-jumlah">-</span></div>
      </div>
      <button class="btn-again" onclick="resetForm()">📖 Isi Buku Tamu Lagi</button>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
// ── Tampilkan tanggal & waktu saat ini di header ────────────
var HARI  =['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var BULAN =['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function padZ(n){ return ('0'+n).slice(-2); }
function updateClock(){
  var d = new Date();
  var tgl = HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear();
  var jam = padZ(d.getHours())+':'+padZ(d.getMinutes());
  document.getElementById('hdr-date').innerHTML = tgl+'<br>'+jam+' WITA';
}
updateClock();
setInterval(updateClock, 30000);

// ── Halaman per pimpinan ────────────────────────────────────
// Diisi server dari alamat: ?page=bukutamu&pimpinan=bupati|wabup|sekda
var PIMPINAN_LIST  = [{key:'bupati',label:'Bupati'},{key:'wabup',label:'Wakil Bupati'},{key:'sekda',label:'Sekretaris Daerah'}];
var _pk = String(new URLSearchParams(location.search).get('pimpinan')||'').toLowerCase();
var _pf = PIMPINAN_LIST.filter(function(p){return p.key===_pk;})[0];
var PIMPINAN_KEY   = _pf ? _pf.key : '';
var PIMPINAN_LABEL = _pf ? _pf.label : '';
var BASE_URL       = location.origin + location.pathname;
if(PIMPINAN_KEY) document.title = 'Buku Tamu - ' + PIMPINAN_LABEL;

(function initHalaman(){
  if(PIMPINAN_KEY){
    document.getElementById('hdr-pimpinan').textContent = ' ' + PIMPINAN_LABEL;
    document.getElementById('card-title').textContent   = '📖 Buku Tamu ' + PIMPINAN_LABEL;
    document.getElementById('target-label').textContent = PIMPINAN_LABEL;
    document.getElementById('form-area').style.display  = '';
  } else {
    // Alamat tanpa pimpinan: tampilkan pilihan tiga halaman
    document.getElementById('card-title').textContent = '📖 Buku Tamu';
    document.getElementById('card-sub').textContent   = 'Silakan pilih pimpinan yang akan ditemui';
    document.getElementById('pick-list').innerHTML = PIMPINAN_LIST.map(function(p){
      var url = BASE_URL + '?pimpinan=' + encodeURIComponent(p.key);
      return '<a class="pick-item" target="_top" href="'+url+'"><span>🏛️</span><span>'+p.label+'</span><span class="arrow">›</span></a>';
    }).join('');
    document.getElementById('pick-area').style.display = '';
  }
})();

// ── Toast ───────────────────────────────────────────────────
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); },3000);
}

// ── Submit ──────────────────────────────────────────────────
function doSubmit(){
  var pimpinan=PIMPINAN_KEY;
  var nama    =document.getElementById('bt-nama').value.trim();
  var instansi=document.getElementById('bt-instansi').value.trim();
  var keperluan=document.getElementById('bt-keperluan').value.trim();
  var jumlah  =document.getElementById('bt-jumlah').value.trim();
  var tempat  =document.getElementById('bt-tempat').value.trim();

  if(!pimpinan){ showToast('Halaman tidak valid, pilih pimpinan terlebih dahulu.'); return; }
  if(!nama||!instansi||!keperluan||!jumlah||!tempat){
    showToast('⚠️ Semua kolom wajib diisi'); return;
  }
  if(isNaN(jumlah)||Number(jumlah)<1){
    showToast('⚠️ Jumlah Orang harus berupa angka minimal 1'); return;
  }

  var btn=document.getElementById('btn-simpan');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Menyimpan...';

  google.script.run
    .withSuccessHandler(function(r){
      btn.disabled=false;
      btn.innerHTML='💾 Simpan';
      if(r&&r.success){
        document.getElementById('r-pimpinan').textContent = r.pimpinanLabel||'-';
        document.getElementById('r-tanggal').textContent  = r.tanggal||'-';
        document.getElementById('r-jam').textContent      = (r.jam||'-')+' WITA';
        document.getElementById('r-agenda').textContent   = r.agendaText||'-';
        document.getElementById('r-tempat').textContent   = r.tempat||'-';
        document.getElementById('r-keperluan').textContent= r.keperluan||'-';
        document.getElementById('r-jumlah').textContent   = r.jumlahOrang||'-';
        document.getElementById('form-area').style.display='none';
        document.getElementById('success-area').style.display='';
      } else {
        showToast('❌ '+(r&&r.message?r.message:'Gagal menyimpan'));
      }
    })
    .withFailureHandler(function(e){
      btn.disabled=false;
      btn.innerHTML='💾 Simpan';
      showToast('❌ Gagal terhubung ke server');
    })
    .submitBukuTamu({pimpinan:pimpinan, nama:nama, instansi:instansi, keperluan:keperluan, jumlahOrang:jumlah, tempat:tempat});
}

// ── Reset ───────────────────────────────────────────────────
function resetForm(){
  ['bt-nama','bt-instansi','bt-keperluan','bt-jumlah','bt-tempat']
    .forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('success-area').style.display='none';
  document.getElementById('form-area').style.display='';
  document.getElementById('bt-nama').focus();
}
</script>
</body>
</html>
